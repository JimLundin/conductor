[workspace]
resolver = "3"
members = ["crates/agents"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
claude-codes = { version = "2.1.323", default-features = false, features = ["async-client"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
tracing = "0.1.44"
