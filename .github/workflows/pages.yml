name: Deploy the web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain from rust-toolchain.toml
        run: rustc -Vv

      - uses: cargo-bins/cargo-binstall@5885714d0a40a14b2535c6ffc051fd8e49aa9665 # v1.27.0
        with:
          version: v1.27.0

      - name: Install dx 0.7.10
        run: cargo binstall dioxus-cli@0.7.10 --no-confirm

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # ring compiles C for wasm32 with clang, which the runner image ships.
      - name: Build the web app with base path /conductor/
        working-directory: crates/app
        run: |
          clang --version
          dx build --platform web --release

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/dx/app/release/web/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
