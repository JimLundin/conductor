name: Deploy the web app, the subset report and the architecture page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The report's history scores past commits.
          fetch-depth: 0

      # rust-toolchain.toml pins nightly; rustup installs it on first use.
      - name: Install the toolchain and the wasm target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - uses: cargo-bins/cargo-binstall@main

      - name: Install dx 0.7.10
        run: cargo binstall dioxus-cli@0.7.10 --no-confirm

      - uses: Swatinem/rust-cache@v2

      # ring compiles C for wasm32 with clang, which the runner image ships.
      - name: Build the web app with base path /conductor/
        working-directory: crates/app
        run: |
          clang --version
          dx build --platform web --release

      # The app routes with the URL hash under /conductor/, so the report's
      # own path, /conductor/report/, never reaches the app.
      - name: Generate the subset report at /conductor/report/
        run: >
          cargo run --release -p subset -- report-html
          --out target/dx/app/release/web/public/report
          --compare tools --compare vendor --history 30

      # A static page beside report/, at /conductor/architecture/; the app's
      # hash routing never sees it. Reuses the subset binary built above.
      - name: Generate the architecture page at /conductor/architecture/
        run: >
          python3 tools/archmap/archmap.py
          --out target/dx/app/release/web/public/architecture
          --subset target/release/subset

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/dx/app/release/web/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
