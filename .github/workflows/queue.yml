# The landing queue. Landing pushes a branch to refs/heads/queue/<name> and
# returns; each push queues a run here, and the runs land one at a time in
# the order they queued: rebase the queued commit onto main, run the units
# without a recorded pass, fast-forward main to the rebased commit, and
# start pages.yml on main, which a push by GITHUB_TOKEN doesn't start.
# GITHUB_TOKEN can't push changes to workflows, so a branch that changes
# .github/workflows or .github/actions is refused before checking; it lands
# by a direct push to main. A refusal, a conflict, a failing unit or a main
# that moved leaves main alone. Either way the run deletes the queue ref,
# unless it moved since, and sets the commit status `queue` on the queued
# commit: success "landed at <sha>", or failure naming the cause, linking
# this run, whose summary holds the failing units' log tails.
#
# Needs no secret, only the permissions granted below. No ruleset may block
# github-actions[bot] from pushing to main or refs/notes/checks.
name: Land queued branches on main

on:
  push:
    branches: ["queue/**"]

permissions: {}

# One run at a time for the repository, the rest waiting in order.
concurrency:
  group: queue
  queue: max

jobs:
  land:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      statuses: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      QUEUED: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    defaults:
      run:
        shell: bash
        working-directory: conductor
    steps:
      - uses: actions/checkout@v7
        with:
          path: conductor
          fetch-depth: 0

      - name: Mark the queued commit as checking
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$QUEUED" -f context=queue \
            -f state=pending -f description="checking over main" -f target_url="$RUN_URL"

      - id: ci
        name: Refuse a branch that changes CI
        run: |
          git fetch -q origin main
          main=$(git rev-parse FETCH_HEAD)
          echo "main=$main" >>"$GITHUB_OUTPUT"
          changed=$(git diff --name-only "$main...HEAD" -- .github/workflows .github/actions)
          [ -n "$changed" ] || exit 0
          {
            echo "## Changes CI, so it lands by a direct push to main"
            echo
            echo '```text'
            echo "$changed"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit 1

      - id: rebase
        name: Rebase the queued commit onto main
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          MAIN: ${{ steps.ci.outputs.main }}
        run: |
          git merge-base --is-ancestor "$MAIN" HEAD && exit 0
          if ! git rebase -q "$MAIN"; then
            conflicts=$(git diff --name-only --diff-filter=U)
            git rebase --abort
            {
              echo "## Conflicts with main at $MAIN"
              echo
              echo '```text'
              echo "$conflicts"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - id: units
        uses: ./conductor/.github/actions/units
        # Until the standards credit passes only on evidence and key suites
        # by what they read, the queue trusts no recorded pass.
        with:
          check-args: --no-cache

      # A plain push only fast-forwards, so a main that moved since the
      # rebase rejects it.
      - id: land
        name: Fast-forward main to the rebased commit
        run: |
          git push -q origin HEAD:refs/heads/main
          echo "landed=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Deploy what landed
        run: gh workflow run pages.yml --ref main

      - name: Report on the queued commit and leave the queue
        if: ${{ !cancelled() }}
        env:
          MAIN: ${{ steps.ci.outputs.main }}
          LANDED: ${{ steps.land.outputs.landed }}
          FAILING: ${{ steps.units.outputs.failing }}
          CI: ${{ steps.ci.outcome }}
          REBASE: ${{ steps.rebase.outcome }}
          UNITS: ${{ steps.units.outcome }}
        run: |
          state=failure
          if [ -n "$LANDED" ]; then
            state=success description="landed at $LANDED"
          elif [ "$CI" = failure ] && [ -n "$MAIN" ]; then
            description="changes CI: land it by pushing to main directly"
          elif [ "$REBASE" = failure ]; then
            description="conflicts with main at $MAIN"
          elif [ -n "$FAILING" ]; then
            description="failed: $FAILING"
          elif [ "$UNITS" = failure ]; then
            description="the units failed"
          elif [ "$UNITS" = success ]; then
            description="main moved or refused the push; queue again"
          else
            description="the queue run failed"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$QUEUED" -f context=queue \
            -f state="$state" -f description="${description:0:140}" -f target_url="$RUN_URL"
          echo "## Queue: $state, $description" >>"$GITHUB_STEP_SUMMARY"
          git push -q --force-with-lease="refs/heads/$GITHUB_REF_NAME:$QUEUED" origin \
            ":refs/heads/$GITHUB_REF_NAME" || echo "$GITHUB_REF_NAME moved; left in the queue"
