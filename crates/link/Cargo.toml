[package]
name = "link"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
agents = { path = "../agents" }
data-encoding.workspace = true
home = { path = "../home" }
host = { path = "../host" }
schemars = { version = "1.2.3", default-features = false, features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
# The ticket token check, in constant time; iroh already builds it.
subtle = { version = "2.6.1", default-features = false }
