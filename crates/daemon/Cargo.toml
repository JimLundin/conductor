[package]
name = "daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.standards]
layer = "shell"

[[bin]]
name = "conductord"
path = "src/main.rs"

[dependencies]
uuid.workspace = true
anyhow.workspace = true
# The credential store's cipher (§6.3), XChaCha20-Poly1305.
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
clap = { version = "4.6.7", features = ["derive"] }
data-encoding.workspace = true
directories = "6.0.0"
getrandom.workspace = true
iroh = { workspace = true, features = ["tls-ring"] }
net = { path = "../net" }
n0-future.workspace = true
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
agents = { path = "../agents" }
host = { path = "../host" }
claude-cli = { path = "../claude-cli" }
codex-cli = { path = "../codex-cli" }
install = { path = "../install" }
proto = { path = "../proto" }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
runtime = { path = "../runtime" }
serde.workspace = true
redb = "3.1"
ulid = "1.2"
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber.workspace = true

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }
claude = { path = "../claude" }
client = { path = "../client" }

[lints]
workspace = true
