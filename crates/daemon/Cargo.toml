[package]
name = "daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.standards]
layer = "shell"

[dependencies]
project-runtime = { path = "../project-runtime" }
vcs = { path = "../vcs" }
uuid = { workspace = true, features = ["v5"] }
anyhow.workspace = true
argon2 = "0.5.3"
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
# The credential store's cipher (§6.3), XChaCha20-Poly1305.
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
data-encoding.workspace = true
getrandom.workspace = true
iroh = { workspace = true, features = ["tls-ring"] }
net = { path = "../net" }
n0-future.workspace = true
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
agents = { path = "../agents" }
home = { path = "../home" }
home-files = { path = "../home-files" }
home-store = { path = "../home-store" }
host = { path = "../host" }
install = { path = "../install" }
link = { path = "../link" }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
runtime = { path = "../runtime" }
sad-web-push = "0.12.0"
serde.workspace = true
serde_json = { workspace = true, features = ["std"] }
redb = "3.1"
ulid = "1.2"
thiserror.workspace = true
tempfile = "3.27.0"
subtle = "2.6.1"
zeroize = "1.8.2"
secrecy = "0.10"
tokio = { workspace = true, features = ["fs", "net", "signal"] }
tracing = { workspace = true, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winx = "0.36.4"
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[target.'cfg(target_os = "windows")'.dependencies]
keyring-core = "1"
windows-native-keyring-store = { version = "1.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = { version = "4.2", default-features = false, features = ["crypto-rust", "vendored"] }

[dev-dependencies]
vcs-git2 = { path = "../vcs-git2" }
tracing-subscriber.workspace = true

[lints]
workspace = true
