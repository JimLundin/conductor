[package]
name = "proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
agents = { path = "../agents" }
data-encoding.workspace = true
# Until host owns the session record: the home types its events and refusals name.
home = { path = "../home" }
serde.workspace = true
serde_json.workspace = true
# The ticket token check, in constant time; iroh already builds it.
subtle = { version = "2.6.1", default-features = false }
schemars = { version = "1.2.3", default-features = false, features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
thiserror.workspace = true

[lints]
workspace = true
