[package]
name = "cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "orchestrator"
path = "src/main.rs"

[package.metadata.standards]
layer = "shell"

[dependencies]
github-api = { path = "../github-api" }
project-runtime = { path = "../project-runtime" }
rpassword = "7.4.0"
zeroize = "1.8.2"
anyhow.workspace = true
agents = { path = "../agents" }
claude = { path = "../claude" }
claude-cli = { path = "../claude-cli" }
clap = { version = "4.6.7", features = ["derive"] }
codex = { path = "../codex" }
codex-cli = { path = "../codex-cli" }
daemon = { path = "../daemon" }
host = { path = "../host" }
runtime = { path = "../runtime" }
tokio.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
