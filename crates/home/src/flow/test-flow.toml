# A flow for the home crate's tests. It began as the home's
# docs/agents/flow.toml and is kept apart on purpose: the tests pin its
# names, and the home changes its own flow without changing these.
# Lists are arrays of tables, so their order is the order shown.

# Issues written before kinds existed read as this kind.
default_kind = "task"

# Statuses. Conductor keys on the role, never the name; each role needs at
# least one status: idle, startable, active, review, terminal, dropped.
[[status]]
name = "open"
role = "idle"
colour = "grey"

[[status]]
name = "ready"
role = "startable"
colour = "blue"

[[status]]
name = "active"
role = "active"
colour = "amber"

[[status]]
name = "review"
role = "review"
colour = "violet"

[[status]]
name = "done"
role = "terminal"
colour = "green"

[[status]]
name = "dropped"
role = "dropped"
colour = "grey"

# Fields every kind has, beyond id, title, kind, status, stage and the log.
# A type is enum (with values), ref or refs (with the kinds they point to),
# text, texts, time or bool. Conductor keys on a field's role, never its
# name: labels (texts) are shown and edited beside the title, branch (text)
# is where sessions land, created (time) is written when an issue opens.
[[field]]
name = "priority"
type = "enum"
values = ["low", "normal", "high", "urgent"]
default = "normal"

[[field]]
name = "labels"
type = "texts"
role = "labels"

[[field]]
name = "branch"
type = "text"
role = "branch"

[[field]]
name = "created"
type = "time"
role = "created"

# Kinds. `sections` are the headings a body is expected to have; a missing
# one warns. `order` is what the app shows first.
[[kind]]
name = "spec"
label = "Spec"
icon = "file-text"
colour = "blue"
sections = ["Problem", "Intended design", "Acceptance"]
order = ["stage", "status", "priority", "labels", "branch"]

[[kind]]
name = "task"
label = "Task"
icon = "square-check"
colour = "teal"
sections = ["What", "Acceptance"]
order = ["status", "priority", "parent", "blocked_by"]

[[kind]]
name = "decision"
label = "Decision"
icon = "signpost"
colour = "amber"
sections = ["Question", "Options"]
fields = [{ name = "method", type = "enum", values = ["research", "prototype", "shape"] }]
order = ["method", "status", "parent"]

[[kind]]
name = "review"
label = "Review"
icon = "eye"
colour = "violet"
sections = ["Scope", "Findings", "Verdict"]
fields = [{ name = "focus", type = "enum", values = ["code", "design"] }]
order = ["focus", "status", "parent", "blocked_by"]

[[kind]]
name = "bug"
label = "Bug"
icon = "bug"
colour = "red"
sections = ["Symptom", "Reproduction", "Fix"]
order = ["stage", "status", "priority", "parent"]

# Relations. Empty `from` or `to` means any kind; `reverse` names the way
# back, for traversal and display.
[[relation]]
name = "parent"
from = ["task", "decision", "review", "bug"]
to = ["spec"]
many = false
cycles = false
shape = "hierarchy"
reverse = "children"

[[relation]]
name = "blocked_by"
many = true
cycles = false
shape = "dependency"
reverse = "blocks"

# Stages, in their usual order. A move to a stage outside `next` is allowed
# and logged as unusual. `skills` serve the stage, the first one leading.
[[stage]]
name = "intake"
next = ["shape", "build"]

[[stage]]
name = "shape"
skills = ["shape", "research"]
next = ["spec"]

[[stage]]
name = "spec"
skills = ["spec"]
sign_off = true
next = ["slice"]

[[stage]]
name = "slice"
skills = ["slice"]
next = ["build"]

[[stage]]
name = "build"
skills = ["build", "diagnose"]
next = ["review"]

[[stage]]
name = "review"
skills = ["review", "deepen"]
next = ["land", "build", "shape"]

[[stage]]
name = "land"
skills = ["land"]
sign_off = true
next = []

# Rules. A predicate is an inline table of one key: an atom (`kind`,
# `stage`, `status_role`, `field`, `has`, `has_section`, and `from`/`to`
# while a move is weighed), `all`/`any` of a list, `not`, or `any`/`all`/
# `none` of `{ via = <relation or its reverse>, where = <predicate> }`.
[[rule]]
message = "A spec is done only after a design review"
severity = "warn"
when = { all = [{ kind = "spec" }, { status_role = "terminal" }] }
require = { any = { via = "children", where = { all = [
  { kind = "review" },
  { field = { focus = "design" } },
  { status_role = "terminal" },
] } } }

[[rule]]
message = "Work starts once everything blocking it is finished"
severity = "warn"
when = { any = [{ status_role = "active" }, { status_role = "review" }, { status_role = "terminal" }] }
require = { all = { via = "blocked_by", where = { any = [
  { status_role = "terminal" },
  { status_role = "dropped" },
] } } }

[[rule]]
message = "A settled decision records its answer"
severity = "warn"
when = { all = [{ kind = "decision" }, { status_role = "terminal" }] }
require = { has_section = "Answer" }

[[rule]]
message = "Decisions and reviews belong to a spec"
severity = "warn"
when = { any = [{ kind = "decision" }, { kind = "review" }] }
require = { has = "parent" }
