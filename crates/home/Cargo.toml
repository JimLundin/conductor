[package]
name = "home"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
schemars = { version = "1.2.3", default-features = false, features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
toml = { version = "1.1.2", default-features = false, features = ["parse", "display", "serde"] }
toml_parser = { version = "1.1.5", default-features = false }
ulid = { version = "1.2", default-features = false }

[dev-dependencies]
jsonschema = { version = "0.63.1", default-features = false }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
proptest = "1"

[lints]
workspace = true
