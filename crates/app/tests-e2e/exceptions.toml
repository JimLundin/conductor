# Where the browser suite departs from the shared TypeScript standard, and why.

[[exception]]
path = "browser.ts"
rule = "lint/style/noRestrictedGlobals"
reason = "the boundary: it alone reads the arguments and environment from process, exits, and arms the scenario's deadline with setTimeout"

[[exception]]
path = "browser.ts"
rule = "lint/style/noProcessEnv"
reason = "the boundary reads the suite's settings from the environment, once, and passes them in"

[[exception]]
path = "browser.ts"
rule = "lint/nursery/noProcessExit"
reason = "the boundary exits on a usage error and once a failure is recorded, which the uncaught-exception handler can't do by throwing"

[[exception]]
path = "browser.ts"
rule = "lint/suspicious/noConsole"
reason = "the boundary writes the run's record to stdout, which tools/e2e-browser.sh keeps"

[[exception]]
path = "browser.ts"
rule = "lint/plugin/noNondeterminism"
reason = "the boundary reads the clock for the log's timestamps and the timings the run records, and passes it in"

[[exception]]
path = "**/*.ts"
rule = "lint/performance/useDomNodeTextContent"
reason = "the checks compare the rendered text, which Playwright's innerText() and the page's innerText give; textContent adds hidden text and source whitespace"

[[exception]]
path = "browser.ts"
rule = "lint/security/noSecrets"
reason = "it flags the iPhone user agent the app is driven with; nothing in it is a secret"

[[exception]]
path = "harness.ts"
rule = "lint/security/noSecrets"
reason = "it flags the form's CSS selectors; nothing in it is a secret"

[[exception]]
path = "scenarios/continue.ts"
rule = "lint/security/noSecrets"
reason = "it flags the form's and the reasoning disclosure's CSS selectors; nothing in it is a secret"

[[exception]]
path = "scenarios/hosts.ts"
rule = "lint/security/noSecrets"
reason = "it flags the host picker's CSS selectors; nothing in it is a secret"

[[exception]]
path = "scenarios/projects.ts"
rule = "lint/security/noSecrets"
reason = "it flags the project and issue forms' CSS selectors; nothing in it is a secret"

[[exception]]
path = "scenarios/screens.ts"
rule = "lint/security/noSecrets"
reason = "it flags the composer's CSS selector; nothing in it is a secret"

[[exception]]
path = "scenarios/sign-in.ts"
rule = "lint/security/noSecrets"
reason = "it flags the sign-in card's CSS selectors; nothing in it is a secret"

[[exception]]
path = "**/*.ts"
rule = "lint/performance/noAwaitInLoops"
reason = "each step drives the one page in order; run at once they would race it"

[[exception]]
path = "scenarios/*.ts"
rule = "lint/nursery/noExcessiveStatementsPerFunction"
reason = "each scenario is already cut into the steps a person takes on one screen (opening a session, answering a card, pairing a host); each step runs to a few dozen page actions and checks, and cutting it at ten statements would split a screen's checks from the actions they follow"

[[exception]]
path = "scenarios/*.ts"
rule = "lint/complexity/noExcessiveLinesPerFunction"
reason = "each step is one screen's actions and checks, and the exact texts it compares against wrap over several lines each, which takes the longer steps past fifty lines"

[[exception]]
path = "profiles"
rule = "drift:fast-check.fast"
reason = "the suite drives a browser and has no property tests, so it has no fast-check profiles"

[[exception]]
path = "profiles"
rule = "drift:fast-check.full"
reason = "the suite drives a browser and has no property tests, so it has no fast-check profiles"

[[exception]]
path = "profiles"
rule = "drift:fast-check.mutation"
reason = "the suite drives a browser and has no property tests, so it has no fast-check profiles"
