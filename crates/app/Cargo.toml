[package]
name = "app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.standards]
layer = "shell"

[dependencies]
net = { path = "../net" }
dioxus = { version = "0.7.10", default-features = false, features = ["launch", "lib", "logger"] }
proto = { path = "../proto" }
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }
tracing = { workspace = true, features = ["std"] }
ui = { path = "../ui" }
web-sys = { version = "0.3.107", features = ["Window", "Location", "Storage", "History"] }

[features]
default = []
web = ["dioxus/web"]

[lints]
workspace = true
