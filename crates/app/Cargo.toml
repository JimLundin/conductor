[package]
name = "app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
client = { path = "../client" }
dioxus = { version = "0.7.10", default-features = false, features = ["launch", "lib", "logger"] }
n0-future.workspace = true
proto = { path = "../proto" }
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }
tracing.workspace = true
web-sys = { version = "0.3.107", features = ["Window", "Location", "Storage", "History"] }

[features]
default = []
web = ["dioxus/web"]
