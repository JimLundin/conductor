[package]
name = "agents"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
data-encoding.workspace = true
# The pinned CLIs' downloads (`install`). iroh already builds both, with ring.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
proto = { path = "../proto" }
serde.workspace = true
serde_json.workspace = true
sha2 = { version = "0.11.0", default-features = false }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
# Edits the private Codex home's config.toml, keeping what Codex wrote there.
toml_edit = { version = "0.25.19", default-features = false, features = ["parse", "display"] }
tracing.workspace = true
uuid.workspace = true
# For the s1 and s2 live checks; the replay tests also use n0-future.
anyhow.workspace = true
n0-future.workspace = true
tracing-subscriber.workspace = true
