[package]
name = "install"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.standards]
layer = "shell"

[dependencies]
agents = { path = "../agents" }
data-encoding.workspace = true
# The pinned CLIs' downloads (`install`). iroh already builds both, with ring.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
sha2 = { version = "0.11.0", default-features = false }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
claude = { path = "../claude" }
n0-future.workspace = true
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
