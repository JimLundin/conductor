# Conductor's own suites, which the shared standard runs beside its checks.
# A suite runs at a tier, and every tier above it, when one of its `when`
# entries matches what changed: a path glob, an affected workspace package
# (changed, or depending on one that changed), or any change at all when the
# entry names neither.

[[suite]]
name = "ip-scrub"
command = "python3 tools/scrub-ips.py --check --run-records && echo 'no public addresses in the run records'"
[[suite.when]]
tier = "commit"
paths = ["docs/**/*.txt", "docs/**/*.log", "docs/**/NOTES.md", "tools/scrub-ips.py"]

[[suite]]
name = "tooling"
command = "python3 -B tools/test-tooling.py"
[[suite.when]]
tier = "commit"
paths = ["tools/test-tooling.py", "tools/scrub-ips.py", "tools/pin", "tools/live-host.sh", "tools/live-host-child.py"]

[[suite]]
name = "wasm-clippy"
command = "cargo clippy --target wasm32-unknown-unknown -p proto -p client -p ui -p net -p app --features app/web"
[[suite.when]]
tier = "commit"
packages = ["proto", "client", "ui", "net", "app"]

[[suite]]
name = "e2e-fixtures"
command = "python3 -I tools/check-e2e-fixtures.py"
[[suite.when]]
tier = "commit"
paths = ["fixtures/**", "tools/check-e2e-fixtures.py"]

[[suite]]
name = "browser"
# At step for a change the web app runs. Its waits are on what the page and
# the hosts show, under a generous ceiling, so a loaded machine slows it
# rather than fails it; it reuses the web build of an unchanged app.
command = "node --test tools/test-push.mjs && python3 -I tools/check-browser-harness.py && tools/e2e-browser.sh"
[[suite.when]]
tier = "release"
[[suite.when]]
tier = "step"
paths = [
    "crates/app/**",
    "crates/ui/**",
    "crates/net/**",
    "crates/proto/**",
    "crates/client/**",
    "fixtures/e2e/**",
    "crates/claude-cli/tests/fake-claude.sh",
    "crates/codex-cli/tests/fake-codex.sh",
    "tools/e2e-browser.sh",
    "tools/test-push.mjs",
    "tools/test-fleet-key.mjs",
    "tools/check-browser-harness.py",
    "crates/conductord/examples/worktrees_browser.rs",
    "tools/e2e-common.sh",
    "tools/e2e-http.py",
    "tools/e2e-host-log.py",
]
