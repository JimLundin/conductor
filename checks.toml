# Conductor's own suites, which the shared standard runs beside its checks.
# A suite runs at a tier, and every tier above it, when one of its `when`
# entries matches what changed: a path glob, an affected workspace package
# (changed, or depending on one that changed), or any change at all when the
# entry names neither. Its key reads those paths and packages, and the pins
# in the standards' tools.env of the tools it names.

[[suite]]
name = "ip-scrub"
command = "python3 tools/scrub-ips.py --check --run-records && echo 'no public addresses in the run records'"
tools = ["PYTHON"]
[[suite.when]]
tier = "commit"
paths = ["docs/**/*.txt", "docs/**/*.log", "docs/**/NOTES.md", "tools/scrub-ips.py"]

[[suite]]
name = "tooling"
command = "python3 -B tools/test-tooling.py && python3 -B tools/test-pin.py"
tools = ["PYTHON"]
[[suite.when]]
tier = "commit"
paths = ["tools/test-tooling.py", "tools/test-pin.py", "tools/scrub-ips.py", "tools/pin"]

[[suite]]
name = "e2e-fixtures"
command = "python3 -I tools/check-e2e-fixtures.py"
tools = ["PYTHON"]
[[suite.when]]
tier = "commit"
paths = ["fixtures/**", "tools/check-e2e-fixtures.py"]

# The browser's iroh, the only crate built for wasm, under clippy on its
# target; the workspace's lint checks it on the host's.
[[suite]]
name = "wasm-clippy"
command = "cargo clippy --target wasm32-unknown-unknown -p web-iroh --lib"
[[suite.when]]
tier = "commit"
packages = ["web-iroh"]

# The app's Effect Schemas in web/src/proto/, generated from proto's
# JSON Schema (ADR 0002): regenerates them and fails on any difference.
[[suite]]
name = "schemas"
command = "cd web && npm ci --no-fund --no-audit --silent && ../tools/schemas.sh --check"
tools = ["NODE", "BIOME"]
[[suite.when]]
tier = "commit"
paths = ["crates/proto/**", "web/src/proto/**", "web/scripts/schemas.ts", "web/package-lock.json", "web/biome.json", "tools/schemas.sh"]
packages = ["proto"]

# The web app, under the shared TypeScript standard, which keys and records
# its own checks. Its key holds no tier, so the commit checks and the step's
# tests are two suites. Both first build web-iroh into web/web-iroh, whose
# declarations the app type-checks against. The standard keys its checks by
# web/'s files alone, which misses web-iroh, so both run every check afresh.
[[suite]]
name = "web"
command = "cd web && npm ci --no-fund --no-audit --silent && npm run build --silent && \"$STANDARDS/typescript/check.sh\" commit --no-cache"
tools = ["NODE"]
[[suite.when]]
tier = "commit"
paths = ["web/**"]
packages = ["web-iroh"]

[[suite]]
name = "web-step"
command = "cd web && npm ci --no-fund --no-audit --silent && npm run pipe --silent && \"$STANDARDS/typescript/check.sh\" step --no-cache"
tools = ["NODE"]
[[suite.when]]
tier = "step"
paths = ["web/**"]
