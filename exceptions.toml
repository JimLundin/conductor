# Where Conductor departs from the shared Rust standard, and why.

[[exception]]
path = "Cargo.toml"
rule = "drift:lints.clippy.multiple_crate_versions"
reason = "iroh and dioxus pin different majors of windows-sys, netlink, thiserror, syn and others; only upstream can unify them"

[[exception]]
path = "crates/proto/src/frame.rs"
rule = "api"
reason = "encode and decode are generic over serde's Serialize and DeserializeOwned, which describe a message's shape and carry no effect"

[[exception]]
path = "crates/app/src/*.rs"
rule = "clippy::disallowed_types"
reason = "rsx! caches each template in a OnceLock static"

[[exception]]
path = "crates/app/src/*.rs"
rule = "clippy::empty_enums"
reason = "derive(Props), which #[component] puts on each props struct, declares empty error enums for missing and repeated props"

[[exception]]
path = "crates/app/src/*.rs"
rule = "clippy::shadow_reuse"
reason = "derive(Props), which #[component] puts on each props struct, rebinds every prop in its builder; an expect on the component can't reach those sibling impls"

[[exception]]
path = "crates/app/src/*.rs"
rule = "clippy::useless_format"
reason = "rsx! expands each \"{text}\" node to format!"

[[exception]]
path = "crates/app/src/ui.rs"
rule = "clippy::volatile_composites"
reason = "asset! reads its link section with read_volatile"

[[exception]]
path = "crates/app/src/ui.rs"
rule = "clippy::future_not_send"
reason = "the link tasks run on the single-threaded UI executor and hold Dioxus signals and an Rc'd link"

# Debt: shell code that still makes decisions. Each entry goes as its
# decisions move into a core crate.

[[exception]]
path = "Cargo.toml"
rule = "shell"
reason = "the shell makes most of the decisions until the registry, serve and provider actors move into host, claude and codex"

[[exception]]
path = "crates/daemon/src/registry.rs"
rule = "shell"
reason = "StartSession and Continue checks and model choice still run in the registry actor; they move into host"

[[exception]]
path = "crates/daemon/src/serve.rs"
rule = "shell"
reason = "the handshake rules still run on the iroh streams; they move into host"

[[exception]]
path = "crates/daemon/src/log.rs"
rule = "shell"
reason = "sequence, epoch and barrier rules still run in the log actor; they move into host"

[[exception]]
path = "crates/daemon/src/workspace.rs"
rule = "shell"
reason = "git output is still parsed and checked beside the git commands; the parsing moves into host"

[[exception]]
path = "crates/daemon/src/start.rs"
rule = "shell"
reason = "choosing each CLI, its sign-in and its models is still decided during startup; it moves into host"

[[exception]]
path = "crates/daemon/src/lib.rs"
rule = "shell"
reason = "loading or creating the key and token still decides inline; the decision moves into host"

[[exception]]
path = "crates/net/src/link.rs"
rule = "shell"
reason = "the hedged dial still races and settles its attempts in net; the rest of the link is client's state machine"

[[exception]]
path = "crates/net/src/wire.rs"
rule = "shell"
reason = "reading a frame still decides between a finished stream and an error beside the read"

[[exception]]
path = "crates/net/src/platform/mod.rs"
rule = "shell"
reason = "the endpoint setup still picks relays per network inline"
