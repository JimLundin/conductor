# Where Conductor departs from the shared Rust standard, and why.

[[exception]]
path = "Cargo.toml"
rule = "drift:lints.clippy.multiple_crate_versions"
reason = "iroh's dependencies pin different majors of rand, digest, thiserror, syn, windows-sys and others; only upstream can unify them"

[[exception]]
path = "crates/link/src/frame.rs"
rule = "api"
reason = "encode and decode are generic over serde's Serialize and DeserializeOwned, which describe a message's shape and carry no effect"

[[exception]]
path = "crates/host/src/fleet/frame.rs"
rule = "api"
reason = "encode and decode are generic over serde's Serialize and DeserializeOwned, which describe a message's shape and carry no effect"

[[exception]]
path = "crates/home/src/id/issue.rs"
rule = "api"
reason = "an IssueId is built only from a tracker's own ID type, so IssueId::of and IssueId::tracked are bounded by TrackerId, which describes an ID's text form and carries no effect; taking plain text instead would give the core a parser of IDs"

[[exception]]
path = "crates/home/src/tracker.rs"
rule = "api"
reason = "Issuer::of turns a tracker's ID type into that tracker's reader, bounded by TrackerId, which describes an ID's text form and carries no effect"

# Debt: shell code that still makes decisions. Each entry goes as its
# decisions move into a core crate.

[[exception]]
path = "Cargo.toml"
rule = "shell"
reason = "the shell makes about a quarter of the decisions: the shells' dispatch of each core's effects plus their branches on I/O results (process exits, file, socket and lock errors, closed channels, which subscription or stream fired), which a core can't take"

# Debt: core values in Box or Rc, which predate the standard's plain-values
# rule. Each entry goes when its file keeps recursive parts in a Vec and
# refers to them by index.

[[exception]]
path = "crates/home/src/flow.rs"
rule = "box"
reason = "boxes recursive or large values, which predates the plain-values rule"

[[exception]]
path = "crates/home/src/flow/eval.rs"
rule = "box"
reason = "boxes recursive or large values, which predates the plain-values rule"

[[exception]]
path = "crates/home/src/flow/role.rs"
rule = "box"
reason = "boxes recursive or large values, which predates the plain-values rule"

[[exception]]
path = "crates/home/src/flow/vocabulary.rs"
rule = "box"
reason = "boxes recursive or large values, which predates the plain-values rule"

[[exception]]
path = "crates/home/src/home.rs"
rule = "box"
reason = "boxes recursive or large values, which predates the plain-values rule"

[[exception]]
path = "crates/home/src/lib.rs"
rule = "box"
reason = "boxes recursive or large values, which predates the plain-values rule"

[[exception]]
path = "crates/host/src/registry/start.rs"
rule = "box"
reason = "boxes recursive or large values, which predates the plain-values rule"

[[exception]]
path = "crates/host/src/session.rs"
rule = "box"
reason = "boxes recursive or large values, which predates the plain-values rule"

[[exception]]
path = "crates/host/src/fleet/protocol.rs"
rule = "box"
reason = "boxes recursive or large values, which predates the plain-values rule"

[[exception]]
path = "crates/home/src/issue/observation.rs"
rule = "box"
reason = "the observation holds either one complete Issue or an invalid, unavailable or deleted record; boxing only the valid payload keeps the states disjoint without fragmenting Issue or adding contradictory optional payloads"
