# Where Conductor departs from the shared Rust standard, and why.

[[exception]]
path = "Cargo.toml"
rule = "drift:lints.clippy.multiple_crate_versions"
reason = "iroh's dependencies pin different majors of rand, digest, thiserror, syn, windows-sys and others; only upstream can unify them"

[[exception]]
path = "crates/link/src/frame.rs"
rule = "api"
reason = "encode and decode are generic over serde's Serialize and DeserializeOwned, which describe a message's shape and carry no effect"

[[exception]]
path = "crates/host/src/fleet/frame.rs"
rule = "api"
reason = "encode and decode are generic over serde's Serialize and DeserializeOwned, which describe a message's shape and carry no effect"

# Debt: shell code that still makes decisions. Each entry goes as its
# decisions move into a core crate.

[[exception]]
path = "Cargo.toml"
rule = "shell"
reason = "the shell makes about a quarter of the decisions: the shells' dispatch of each core's effects plus their branches on I/O results (process exits, file, socket and lock errors, closed channels, which subscription or stream fired), which a core can't take"

# Debt: core values in Box or Rc, which predate the standard's plain-values
# rule. Each entry goes when its file keeps recursive parts in a Vec and
# refers to them by index.

[[exception]]
path = "crates/home/src/flow.rs"
rule = "box"
reason = "boxes recursive or large values, which predates the plain-values rule"

