# Where Conductor departs from the shared Rust standard, and why.

[[exception]]
path = "Cargo.toml"
rule = "drift:lints.clippy.multiple_crate_versions"
reason = "iroh and dioxus pin different majors of windows-sys, netlink, thiserror, syn and others; only upstream can unify them"

[[exception]]
path = "crates/net/Cargo.toml"
rule = "std"
reason = "net is proto's I/O on iroh streams, which need std"

[[exception]]
path = "crates/agents/Cargo.toml"
rule = "std"
reason = "agents spawns and drives the claude and codex processes over tokio"

[[exception]]
path = "crates/client/Cargo.toml"
rule = "std"
reason = "client holds the iroh link to a host and its reconnect loop"

[[exception]]
path = "crates/daemon/Cargo.toml"
rule = "std"
reason = "daemon serves iroh connections and stores the event log in redb"
