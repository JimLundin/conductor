# Dependencies that do not exist yet.
[[planned_dep]]
from = "daemon"
to = "agents"
unit = "p1-4"

[[bug]]
title = "Rare 30 s \"connection lost\""
detail = "A fresh connection sometimes gets no Welcome and dies at the 30 s idle timeout. Not reproduced yet."
[[bug]]
title = "app is not in the subset yet"
detail = "Unit 6 rewrites the screens into the subset."
crate = "app"
